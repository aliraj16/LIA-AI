name: Build MILI AI APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Direct Debug APK
        run: ./gradlew --no-daemon assembleDirectDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MILI-AI-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
