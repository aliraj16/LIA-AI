name: Build LIA AI APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build LIA AI APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDirectDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIA-AI-APK
          path: app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
